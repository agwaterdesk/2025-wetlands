<style>
.full-bleed {
	width: 100vw;
	margin-left: calc(50% - 50vw);
	margin-right: calc(50% - 50vw);
}
#proj-container {
	isolation: isolate;
}
</style>

<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/agwaterdesk/2025-wetlands@ghost/docs/assets/index-B8qKf_iu.css">

<div class="full-bleed">
<div id="proj-container" style="width:100%;box-sizing:border-box;padding-inline:0">
	<p>Loading…</p>
</div>
</div>

<script>
(function () {
	const script = document.createElement("script");
	script.type = "module";
	script.crossOrigin = "anonymous";
	script.src = "https://cdn.jsdelivr.net/gh/agwaterdesk/2025-wetlands@ghost/docs/assets/index-B-kRS71N.js";
	script.addEventListener("error", () => {
		console.error("Svelte app failed to load from CDN");
		const container = document.getElementById("proj-container");
		if (container) {
			container.innerHTML = "<p>Error loading story. If assets load in the browser but not here, your site may block external scripts (CSP). Allow https://cdn.jsdelivr.net in script-src.</p>";
		}
	});
	document.head.appendChild(script);
})();
</script>
